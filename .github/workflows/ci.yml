name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: iPhone build and tests
    # The bundled LiteRT framework is arm64-only, so this needs an Apple silicon runner and a
    # concrete simulator destination rather than the generic one.
    # GitHub's Xcode 27 image (macOS 27, arm64). Still a public preview as of October 2026.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Angrove builds with Xcode 27 (iOS 27 SDK); older compilers reject code Xcode 27 accepts.
      - name: Select Xcode 27
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::Xcode 27 is not installed on this runner image."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS

      - name: Build and run tests
        # Local model and grounding assets are gitignored; suites that need them skip themselves.
        # Sign ad hoc ("Sign to Run Locally"), as local simulator builds do: an unsigned app has no
        # Keychain entitlement, so encrypted storage fails with errSecMissingEntitlement (-34018).
        run: |
          set -o pipefail
          xcodebuild \
            -project Angrove-iOS.xcodeproj \
            -scheme Angrove-iOS \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestResults
          path: TestResults.xcresult

  mac-build-and-test:
    name: Mac build and tests
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 27
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::Xcode 27 is not installed on this runner image."
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
      - name: Test shared core package
        run: swift test --package-path Packages/AngroveCore
      - name: Build and run Mac tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Angrove-iOS.xcodeproj \
            -scheme Angrove-macOS \
            -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath MacTestResults.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Upload Mac test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MacTestResults
          path: MacTestResults.xcresult

  documentation-and-tools:
    name: Documentation and offline tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check public documentation links
        run: python3 scripts/check_documentation_links.py
      - name: Install Library tooling dependencies
        run: python3 -m pip install -r scripts/library/requirements.txt
      - name: Verify evidence exporter and Library tooling
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 -m unittest discover -s scripts/library -p 'test_*.py' -v
