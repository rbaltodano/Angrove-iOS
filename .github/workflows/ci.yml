name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # The bundled LiteRT framework is arm64-only, so this needs an Apple silicon runner and a
    # concrete simulator destination rather than the generic one.
    # GitHub's Xcode 27 image (macOS 27, arm64). Still a public preview as of October 2026.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Angrove builds with Xcode 27 (iOS 27 SDK); older compilers reject code Xcode 27 accepts.
      - name: Select Xcode 27
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::Xcode 27 is not installed on this runner image."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS

      - name: Build and run tests
        # Local model and grounding assets are gitignored; suites that need them skip themselves.
        run: |
          set -o pipefail
          xcodebuild \
            -project Angrove-iOS.xcodeproj \
            -scheme Angrove-iOS \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
